<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width"/>

        <title>Guild Fest Message Board</title>
        
        <link rel="stylesheet" href="style.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

        <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
        <link rel="manifest" href="favicon/site.webmanifest">

    </head>

    <body>
        <div class="nav-parent">
            <nav>
                <ul class="nav-ele">
                    <li><a href="https://linktr.ee/uwidmc">Join DMC</a></li>
                    <li><a href="index.html">Message Board</a></li>
                </ul>
            </nav>
        </div>

        <div class="container-main">
            <div class="header-main"><h2>DMC Message Board</h2></div>
            <div id="compose" class="box">
                <form method="post" id="messageForm">
                    
                    <div class="userDetails">

                        <div class="name-section">
                            <label for="name">Name:</label>
                            <input type="text" name="name" id="senderName" maxlength="50">
                        </div>
                        
                        <div class="degree-section">
                            <label for="degree">Degree:</label>
                            <input type="text" name="degree" id="senderDegree" maxlength="50">
                        </div>
                    </div>
                    
                    <div class="message-section">
                        <label for="message">Message:</label>
                        <input type="text" id="messageInput">
                        <button type="submit">Send</button>
                    </div>
                    <div>
                        <button id="loadMoreBtn" type="button" hidden>Load more</button>
                    </div>

                </form>
            </div>
            <div class="pages"></div>
            <div id="messageList" class="box"></div>
        
            </div>
            <div id="footer">
                <div id="footer-content">
                    <p>Digital Media Club</p>
            </div>
        </div>
        </div>
        <script type="module" src="app.js"></script>
    </body>
</html>
